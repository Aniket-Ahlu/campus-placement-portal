{% extends 'base.html' %}

{% block title %}500 - Server Error | Campus Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 text-center">
        <div class="card p-5 border-0 shadow-sm">
            <div class="mb-4 text-danger">
                <i class="bi bi-exclamation-octagon display-1"></i>
            </div>
            <h2 class="fw-bold mb-3">500 - Internal Server Error</h2>
            <p class="text-muted fs-5 mb-4">
                {{ message|default:"An unexpected server error occurred. Our team has been notified." }}
            </p>
            <div>
                <a href="{% url 'core:landing' %}" class="btn btn-indigo">
                    <i class="bi bi-house me-1"></i> Return to Safety
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
